[project]
name = "semanticproductsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langsmith>=0.11.0",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.3",
    "uvicorn>=0.52.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","F","I","UP"]
ignore = ["D100"]