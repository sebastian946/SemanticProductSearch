[project]
name = "semanticproductsearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "cachetools>=7.1.7",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langsmith>=0.11.0",
    "mcp>=1.9,<2",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pgvector>=0.2.5,<0.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "ruff>=0.16.3",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "uvicorn>=0.52.3",
]

# torch desde el índice CPU: en Docker/Linux el default de PyPI arrastra
# CUDA (~5GB) que no se usa; en Windows dev ya era CPU, así que es consistente.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E","F","I","UP"]
ignore = ["D100"]
